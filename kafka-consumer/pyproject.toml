[project]
name = "kafka-consumer"
version = "0.1.0"
description = "Standalone Kafka consumer service for todo platform — Phase V"
requires-python = ">=3.13"
dependencies = [
    "aiokafka>=0.11",
    "python-dotenv>=1.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--cov=. --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*", ".venv/*"]
