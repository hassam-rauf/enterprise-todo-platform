# Bitnami Kafka 3.9 in KRaft mode (no ZooKeeper) for local development.
# Usage:
#   Start Kafka only:     docker compose -f cloud/kafka/docker-compose.kafka.yml up -d
#   Include consumer:     docker compose -f cloud/kafka/docker-compose.kafka.yml --profile consumer up -d
#   Verify health:        docker exec todo-kafka kafka-topics.sh --list --bootstrap-server localhost:9092

services:
  kafka:
    image: bitnami/kafka:3.9
    container_name: todo-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft identity
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"

      # Listeners — PLAINTEXT for clients, CONTROLLER for KRaft raft
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      # KRaft quorum (single-node self-referencing)
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"

      # Disable broker auto-create — topics provisioned by admin client (FR-017)
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"

      # Required for single-broker dev cluster
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --list --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  kafka-consumer:
    build:
      context: ../../kafka-consumer
      dockerfile: Dockerfile
    container_name: todo-kafka-consumer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_PREFIX: ""
    profiles:
      - consumer   # opt-in: docker compose --profile consumer up

volumes:
  kafka-data:
