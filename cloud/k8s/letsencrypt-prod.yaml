# cert-manager ClusterIssuer — Let's Encrypt production ACME HTTP-01.
# Apply once per cluster: kubectl apply -f cloud/k8s/letsencrypt-prod.yaml
# Replace <developer-email> with a real email address before applying.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: shehrozhanif54@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: nginx
