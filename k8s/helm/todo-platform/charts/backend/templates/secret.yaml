{{/* [Task]: T002 [From]: specs/phase4-k8s/helm-deployment/spec.md §FR-002 */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backend.fullname" . }}-secret
  labels:
    {{- include "backend.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $val := .Values.secrets }}
  {{- if $val }}
  {{ $key }}: {{ $val | b64enc | quote }}
  {{- end }}
  {{- end }}
